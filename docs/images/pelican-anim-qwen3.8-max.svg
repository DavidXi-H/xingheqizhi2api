<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 600 400" width="600" height="400" role="img"
     aria-label="A pelican riding a bicycle">
  <title>Pelican on a Bicycle</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#dff0fb"/>
      <stop offset="100%" stop-color="#f8fcfe"/>
    </linearGradient>

    <g id="spokes" stroke="#93a2ac" stroke-width="2">
      <line x1="-47" y1="0" x2="47" y2="0"/>
      <line x1="-47" y1="0" x2="47" y2="0" transform="rotate(30)"/>
      <line x1="-47" y1="0" x2="47" y2="0" transform="rotate(60)"/>
      <line x1="-47" y1="0" x2="47" y2="0" transform="rotate(90)"/>
      <line x1="-47" y1="0" x2="47" y2="0" transform="rotate(120)"/>
      <line x1="-47" y1="0" x2="47" y2="0" transform="rotate(150)"/>
    </g>

    <g id="wheel">
      <circle r="55" fill="none" stroke="#2f3a42" stroke-width="7"/>
      <circle r="47" fill="none" stroke="#8d9ba5" stroke-width="2"/>
      <use xlink:href="#spokes" href="#spokes"/>
      <circle cx="0" cy="-50" r="4" fill="#e8b33a"/>
      <circle r="7" fill="#5b6a74"/>
      <circle r="3" fill="#2f3a42"/>
    </g>
  </defs>

  <!-- ===== background ===== -->
  <rect x="0" y="0" width="600" height="400" fill="url(#sky)"/>
  <circle cx="520" cy="62" r="26" fill="#ffe9a8"/>

  <!-- ===== speed streaks (loop seamlessly) ===== -->
  <g stroke="#a9c3d2" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -60 0" dur="0.6s" repeatCount="indefinite"/>
    <line x1="20"  y1="338" x2="70"  y2="338"/>
    <line x1="80"  y1="338" x2="130" y2="338"/>
    <line x1="140" y1="338" x2="190" y2="338"/>
    <line x1="-10" y1="320" x2="35"  y2="320"/>
    <line x1="50"  y1="320" x2="95"  y2="320"/>
    <line x1="110" y1="320" x2="155" y2="320"/>
    <line x1="30"  y1="302" x2="72"  y2="302"/>
    <line x1="90"  y1="302" x2="132" y2="302"/>
  </g>

  <!-- ===== ground ===== -->
  <line x1="0" y1="350" x2="600" y2="350" stroke="#3b4a55" stroke-width="4"/>
  <ellipse cx="165" cy="352" rx="58" ry="6" fill="#000000" opacity="0.12"/>
  <ellipse cx="435" cy="352" rx="58" ry="6" fill="#000000" opacity="0.12"/>

  <!-- ===== rear wheel ===== -->
  <g transform="translate(165,295)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use xlink:href="#wheel" href="#wheel"/>
    </g>
  </g>

  <!-- ===== frame ===== -->
  <g stroke="#c8442e" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="165" y1="295" x2="300" y2="300"/>  <!-- chainstay -->
    <line x1="165" y1="295" x2="262" y2="192"/>  <!-- seatstay -->
    <line x1="300" y1="300" x2="262" y2="192"/>  <!-- seat tube -->
    <line x1="300" y1="300" x2="412" y2="232"/>  <!-- down tube -->
    <line x1="262" y1="192" x2="398" y2="186"/>  <!-- top tube -->
  </g>
  <g stroke="#a8382a" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="398" y1="186" x2="412" y2="232"/>  <!-- head tube -->
    <line x1="412" y1="232" x2="435" y2="295"/>  <!-- fork -->
  </g>

  <!-- saddle + seatpost -->
  <line x1="262" y1="196" x2="260" y2="212" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
  <path d="M234 190 Q262 178 293 189 Q292 197 262 201 Q239 199 234 190 Z" fill="#2b2b2b"/>

  <!-- handlebar -->
  <g stroke="#2b2b2b" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="398" y1="186" x2="404" y2="164"/>
    <path d="M404 164 Q422 150 440 160 Q446 165 441 172"/>
  </g>

  <!-- chain -->
  <g stroke="#4a5560" stroke-width="3" fill="none">
    <line x1="300" y1="282" x2="165" y2="287"/>
    <line x1="300" y1="318" x2="165" y2="303"/>
  </g>
  <circle cx="165" cy="295" r="10" fill="none" stroke="#4a5560" stroke-width="4"/>

  <!-- ===== front wheel ===== -->
  <g transform="translate(435,295)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use xlink:href="#wheel" href="#wheel"/>
    </g>
  </g>

  <!-- ===== crank + pedals ===== -->
  <g transform="translate(300,300)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#59636c" stroke-width="4"/>
      <line x1="0" y1="0" x2="-30" y2="0" stroke="#8a939b" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(-30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-3.5" width="20" height="7" rx="3" fill="#1f1f1f"/>
        </g>
      </g>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#3d464d" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(30,0)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-10" y="-3.5" width="20" height="7" rx="3" fill="#111111"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#22282d"/>
  </g>

  <!-- ===== pelican (bobs with the pedal cadence) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -4; 0 0; 0 3; 0 0"
                      keyTimes="0; 0.25; 0.5; 0.75; 1"
                      dur="0.6s" repeatCount="indefinite"/>

    <!-- far leg -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="13 256 170; -13 256 170; 13 256 170"
                        keyTimes="0; 0.5; 1" dur="1.2s" repeatCount="indefinite"/>
      <path d="M256 170 Q284 212 297 256" fill="none" stroke="#c9701f"
            stroke-width="10" stroke-linecap="round"/>
      <path d="M295 254 L318 261 L316 268 L292 262 Z" fill="#c9701f"/>
    </g>

    <!-- tail feathers -->
    <path d="M210 138 Q180 122 156 127 Q176 140 171 151 Q192 157 212 165 Z"
          fill="#dfe7ed" stroke="#c2ccd4" stroke-width="2"/>

    <!-- body -->
    <ellipse cx="245" cy="152" rx="47" ry="34" transform="rotate(-12 245 152)"
             fill="#f4f7f9" stroke="#d3dce2" stroke-width="2"/>
    <path d="M215 168 Q245 186 280 172 Q262 190 236 186 Q220 181 215 168 Z" fill="#e4ebf0"/>

    <!-- folded wing -->
    <path d="M228 140 Q262 128 288 146 Q272 166 244 166 Q228 160 228 140 Z"
          fill="#e2e9ef" stroke="#c3ccd4" stroke-width="2"/>
    <path d="M240 150 Q262 144 280 152" fill="none" stroke="#c3ccd4" stroke-width="2"/>

    <!-- neck -->
    <path d="M270 143 Q288 104 322 94" fill="none" stroke="#f4f7f9"
          stroke-width="23" stroke-linecap="round"/>
    <path d="M270 143 Q288 104 322 94" fill="none" stroke="#dfe7ed"
          stroke-width="23" stroke-linecap="round" opacity="0.35"/>

    <!-- head -->
    <circle cx="330" cy="90" r="17" fill="#f4f7f9" stroke="#d3dce2" stroke-width="2"/>
    <path d="M320 74 L308 60 L323 70 L317 54 L330 70 Z" fill="#e6ecef" stroke="#c9d3da" stroke-width="1.5"/>

    <!-- beak + pouch -->
    <path d="M342 92 L427 103 Q396 139 358 118 Q346 108 342 92 Z"
          fill="#f8c471" stroke="#e0a344" stroke-width="2"/>
    <path d="M340 78 L429 96 L428 104 L342 92 Z" fill="#f39c12" stroke="#d4820c" stroke-width="1.5"/>
    <path d="M429 96 L438 100 L428 104 Z" fill="#e08a0c"/>

    <!-- eye -->
    <circle cx="334" cy="84" r="4.5" fill="#ffffff" stroke="#c9d3da" stroke-width="1"/>
    <circle cx="335.5" cy="84" r="2.3" fill="#1b1b1b"/>

    <!-- wing-arm reaching the handlebar -->
    <path d="M284 146 Q348 146 402 162" fill="none" stroke="#eef2f5"
          stroke-width="9" stroke-linecap="round"/>
    <path d="M284 146 Q348 146 402 162" fill="none" stroke="#cfd8de"
          stroke-width="2" stroke-linecap="round"/>
    <path d="M398 157 L418 163 L416 170 L396 165 Z" fill="#f39c12"/>

    <!-- near leg -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-13 256 170; 13 256 170; -13 256 170"
                        keyTimes="0; 0.5; 1" dur="1.2s" repeatCount="indefinite"/>
      <path d="M256 170 Q286 214 299 258" fill="none" stroke="#e8862a"
            stroke-width="11" stroke-linecap="round"/>
      <path d="M297 256 L320 263 L318 270 L294 264 Z" fill="#e8862a"/>
    </g>
  </g>
</svg>